<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF Fácil</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1d1d1b;--muted:#6b6a64;--accent:#d9480f;--accent-t:#fff;--line:#e3e1da;--soft:#fbeee7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232321;--text:#f0eee8;--muted:#a09e96;--accent:#ff7a3d;--accent-t:#1a1a18;--line:#35342f;--soft:#33251d}}
:root[data-theme="dark"]{--bg:#171716;--card:#232321;--text:#f0eee8;--muted:#a09e96;--accent:#ff7a3d;--accent-t:#1a1a18;--line:#35342f;--soft:#33251d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;margin:8px 0 2px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#theme{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1.3rem;cursor:pointer;flex:none}
.sub{color:var(--muted);margin:0 0 20px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.tab{padding:12px 6px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--text);font-size:.9rem;font-weight:600;cursor:pointer}
.tab .ic{display:block;font-size:1.8rem;margin-bottom:4px}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.pick{display:block;width:100%;padding:16px;border:2px dashed var(--accent);border-radius:14px;background:transparent;color:var(--accent);font-size:1.05rem;font-weight:600;cursor:pointer}
ul{list-style:none;margin:14px 0 0;padding:0}
li{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.95rem}
li .box{flex:1;min-width:0}
li .box .n{display:block}
li input[type=text]{width:100%;margin-top:6px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
li .num{color:var(--muted);width:1.4em;text-align:right}
li button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem;cursor:pointer}
li button:disabled{opacity:.3}
.q{display:block;margin:16px 0 6px;font-weight:600;font-size:.95rem}
select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
.note{margin-top:8px;color:var(--muted);font-size:.85rem;min-height:1.2em}
.go{margin-top:16px;width:100%;padding:16px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-t);font-size:1.1rem;font-weight:700;cursor:pointer}
.go:disabled{opacity:.4}
.msg{margin-top:12px;min-height:1.4em;font-size:.95rem}
.msg.err{color:#c92a2a}
.priv{margin-top:20px;color:var(--muted);font-size:.85rem;text-align:center}
ul.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.grid li{display:block;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.grid .th{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--bg);border-radius:8px}
.grid .th img{max-width:100%;max-height:100%;transition:transform .2s}
.grid .pn{font-size:.8rem;color:var(--muted);margin:6px 0}
.grid .row{display:flex;gap:4px;justify-content:center;margin-top:4px}
.grid .row button{width:36px;height:36px;font-size:.95rem}
.tab:last-child:nth-child(odd){grid-column:1/-1}
.mini{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:.95rem;cursor:pointer}
.mini:disabled{opacity:.35}
.spg{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 8px;font-weight:600}
.srow{display:flex;gap:8px;margin-top:10px}
.srow .mini{flex:1}
#stage{position:relative;margin:0 auto;background:#fff;border:1px solid var(--line);line-height:0;overflow:hidden}
#scv{display:block}
#ov{position:absolute;display:none;touch-action:none;cursor:grab;outline:2px dashed var(--accent)}
#ov img{width:100%;height:100%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
#ssize{width:100%}
</style>
</head>
<body>
<main>
  <div class="top"><div><h1>PDF Fácil</h1>
  <p class="sub">Todo de manera local :D</p></div>
  <button id="theme" aria-label="Cambiar entre modo claro y oscuro">🌙</button></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-merge" aria-selected="true"><span class="ic">📑</span>Unir PDFs</button>
    <button class="tab" role="tab" id="t-img" aria-selected="false"><span class="ic">🖼️</span>Imágenes a PDF</button>
    <button class="tab" role="tab" id="t-edit" aria-selected="false"><span class="ic">✂️</span>Editar páginas</button>
    <button class="tab" role="tab" id="t-unlock" aria-selected="false"><span class="ic">🔓</span>Desbloquear</button>
    <button class="tab" role="tab" id="t-stamp" aria-selected="false"><span class="ic">🖊️</span>Añadir imagen</button>
  </div>

  <div class="card">
    <button class="pick" id="pick">+ Elige los archivos</button>
    <button class="pick" id="pickimg" style="display:none;margin-top:10px">+ Elige la imagen</button>
    <input type="file" id="file" multiple hidden>
    <input type="file" id="fileimg" accept="image/*" hidden>
    <div class="note" id="hint"></div>
    <div id="stampui" style="display:none">
      <div class="spg"><button class="mini" id="sprev">◀</button><span id="slabel">Elige un PDF y una imagen</span><button class="mini" id="snext">▶</button></div>
      <div id="stage"><canvas id="scv"></canvas><div id="ov"><img id="ovimg" alt=""></div></div>
      <div class="srow"><button class="mini" id="shere">Poner aquí</button><button class="mini" id="scopy">Copiar a todas</button></div>
      <label class="q" for="ssize">Tamaño de la imagen</label>
      <input type="range" id="ssize" min="5" max="100" value="30">
      <div class="note">Toca la página para mover la imagen ahí, o arrástrala</div>
    </div>
    <ul id="list"></ul>
    <div id="qwrap">
    <label class="q" for="qual">Calidad</label>
    <select id="qual">
      <option value="orig">Original (sin tocar nada)</option>
      <option value="med">Comprimir (equilibrado)</option>
      <option value="low">Comprimir al máximo (más chico)</option>
    </select>
    <div class="note" id="qnote"></div>
    </div>
    <button class="go" id="go" disabled>Crear PDF</button>
    <div class="msg" id="msg" role="status"></div>
  </div>
  <p class="priv">Ordénalos con ▲ ▼. Si solo quieres algunas páginas de un PDF, escríbelas en su casilla (ej: 2 o 1-3, 5).</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(function(){
  var mode = 'merge', files = [], editPages = [], editBuf = null, loadId = 0;
  var stampBuf = null, stampDoc = null, stampImg = null, stampPage = 0, placements = {}, stampSize = 0.3, dispW = 0, dispH = 0, renderTok = 0;
  var $ = function(id){return document.getElementById(id)};
  var input = $('file'), list = $('list'), go = $('go'), msg = $('msg');

  function setMode(m){
    mode = m; files = []; editPages = []; editBuf = null; loadId++;
    $('t-merge').setAttribute('aria-selected', m==='merge');
    $('t-img').setAttribute('aria-selected', m==='img');
    $('t-edit').setAttribute('aria-selected', m==='edit');
    $('t-unlock').setAttribute('aria-selected', m==='unlock');
    $('t-stamp').setAttribute('aria-selected', m==='stamp');
    stampReset();
    $('stampui').style.display = m==='stamp' ? '' : 'none';
    $('pickimg').style.display = m==='stamp' ? '' : 'none';
    list.style.display = m==='stamp' ? 'none' : '';
    input.accept = m==='img' ? 'image/*' : 'application/pdf,.pdf';
    input.multiple = m !== 'edit' && m !== 'unlock' && m !== 'stamp';
    $('pick').textContent = m==='merge' ? '+ Elige los PDFs' : m==='img' ? '+ Elige las imágenes' : m==='stamp' ? '+ Elige el PDF' : '+ Elige un PDF';
    $('qwrap').style.display = (m==='edit' || m==='unlock' || m==='stamp') ? 'none' : '';
    $('hint').textContent = m==='edit' ? 'Gira, mueve o quita las páginas que quieras. Las que quites no aparecerán en el PDF nuevo :D' : m==='stamp' ? 'Elige el PDF y la imagen (una firma, un logo, una foto…). Ve a la página que quieras y toca dónde va.' : m==='unlock' ? 'Quita restricciones como no poder imprimir o copiar, y conserva el texto. Úsalo con documentos que tengas derecho a usar.' : '';
    say(''); render(); if (typeof updateNote === 'function') updateNote();
  }
  function say(t, err){ msg.textContent = t; msg.className = 'msg' + (err ? ' err' : ''); }

  function render(){
    if (mode === 'edit'){ renderEdit(); return; }
    if (mode === 'stamp'){ renderStamp(); return; }
    list.className = '';
    list.innerHTML = '';
    files.forEach(function(f, i){
      var li = document.createElement('li');
      var num = document.createElement('span'); num.className = 'num'; num.textContent = i+1;
      var n = document.createElement('span'); n.className = 'n'; n.textContent = f.name;
      var box = document.createElement('div'); box.className = 'box'; box.appendChild(n);
      if (mode === 'merge'){
        var pi = document.createElement('input'); pi.type = 'text'; pi.inputMode = 'text';
        pi.placeholder = 'Deja el espacio vacío para todas las páginas';
        pi.value = f.pages || '';
        pi.oninput = function(){ f.pages = pi.value };
        box.appendChild(pi);
      }
      var up = document.createElement('button'); up.textContent = '▲'; up.disabled = i===0;
      var dn = document.createElement('button'); dn.textContent = '▼'; dn.disabled = i===files.length-1;
      var rm = document.createElement('button'); rm.textContent = '✕';
      up.onclick = function(){ swap(i, i-1) };
      dn.onclick = function(){ swap(i, i+1) };
      rm.onclick = function(){ files.splice(i,1); render() };
      [num,box,up,dn,rm].forEach(function(e){ li.appendChild(e) });
      list.appendChild(li);
    });
    go.disabled = files.length === 0 || (mode==='merge' && files.length < 2);
    go.textContent = mode==='merge' ? 'Unir y crear PDF' : mode==='stamp' ? 'Crear PDF con la imagen' : mode==='unlock' ? 'Desbloquear PDF' : 'Crear PDF';
  }
  function swap(a,b){ var t = files[a]; files[a] = files[b]; files[b] = t; render(); }

  $('pick').onclick = function(){ input.click() };
  input.onchange = function(){
    if (mode === 'edit'){
      var ef = input.files[0]; input.value = '';
      if (ef) loadEdit(ef);
      return;
    }
    if (mode === 'stamp'){
      var sf = input.files[0]; input.value = '';
      if (sf) loadStampPdf(sf);
      return;
    }
    if (mode === 'unlock'){
      files = input.files[0] ? [input.files[0]] : []; input.value = ''; say(''); render();
      return;
    }
    Array.prototype.forEach.call(input.files, function(f){ files.push(f) });
    input.value = ''; say(''); render();
  };
  $('t-merge').onclick = function(){ setMode('merge') };
  $('t-img').onclick = function(){ setMode('img') };
  $('t-edit').onclick = function(){ setMode('edit') };
  $('t-unlock').onclick = function(){ setMode('unlock') };
  $('t-stamp').onclick = function(){ setMode('stamp') };
  $('pickimg').onclick = function(){ $('fileimg').click() };
  $('fileimg').onchange = function(){ var f = $('fileimg').files[0]; $('fileimg').value = ''; if (f) loadStampImg(f); };

  function toPng(file){
    return createImageBitmap(file).then(function(bm){
      var c = document.createElement('canvas'); c.width = bm.width; c.height = bm.height;
      c.getContext('2d').drawImage(bm, 0, 0);
      return new Promise(function(res){ c.toBlob(function(b){ b.arrayBuffer().then(function(ab){ res({bytes: ab, png: true}) }) }, 'image/png') });
    });
  }

  function parsePages(str, total, name){
    str = (str || '').trim();
    if (!str) return Array.from({length: total}, function(_, i){ return i });
    var out = [];
    str.split(',').forEach(function(part){
      part = part.trim(); if (!part) return;
      var m = part.match(/^(\d+)\s*(?:-\s*(\d+))?$/);
      if (!m) throw new Error('Páginas no válidas en "' + name + '": ' + part);
      var a = parseInt(m[1],10), b = m[2] ? parseInt(m[2],10) : a;
      if (a < 1 || b < a || b > total) throw new Error('"' + name + '" tiene ' + total + ' páginas y pediste: ' + part);
      for (var k=a; k<=b; k++) out.push(k-1);
    });
    if (!out.length) throw new Error('No elegiste páginas en "' + name + '"');
    return out;
  }

  var QUAL = {
    med: {dpi: 120, jpg: 0.7, maxPx: 1800},
    low: {dpi: 80,  jpg: 0.5, maxPx: 1200}
  };
  var pdfjsP = null;
  function loadPdfjs(){
    if (pdfjsP) return pdfjsP;
    var base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    pdfjsP = new Promise(function(res, rej){
      var sc = document.createElement('script'); sc.src = base + 'pdf.min.js';
      sc.onload = function(){
        fetch(base + 'pdf.worker.min.js').then(function(r){ return r.text() }).then(function(t){
          pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], {type:'text/javascript'}));
          res(pdfjsLib);
        }).catch(rej);
      };
      sc.onerror = function(){ pdfjsP = null; rej(new Error('No se pudo cargar el compresor. Revisa tu conexión.')) };
      document.head.appendChild(sc);
    });
    return pdfjsP;
  }
  var QPDF_BASE = 'https://cdn.jsdelivr.net/npm/@neslinesli93/qpdf-wasm@0.3.0/dist/';
  var qpdfP = null;
  function loadQpdf(){
    if (qpdfP) return qpdfP;
    qpdfP = new Promise(function(res, rej){
      var sc = document.createElement('script'); sc.src = QPDF_BASE + 'qpdf.js';
      sc.onload = function(){
        Module({locateFile: function(f){ return QPDF_BASE + f }, print: function(){}, printErr: function(){}}).then(res, rej);
      };
      sc.onerror = function(){ qpdfP = null; rej(new Error('No se pudo cargar el desbloqueador. Revisa tu conexión.')) };
      document.head.appendChild(sc);
    });
    return qpdfP;
  }
  async function decryptPdf(buf, password){
    var q = await loadQpdf();
    q.FS.writeFile('/in.pdf', new Uint8Array(buf));
    var args = []; if (password) args.push('--password=' + password);
    args.push('--decrypt', '/in.pdf', '/out.pdf');
    try { q.callMain(args); } catch(e) {}
    var out = null;
    try { out = q.FS.readFile('/out.pdf'); } catch(e) {}
    try { q.FS.unlink('/in.pdf'); } catch(e) {}
    try { q.FS.unlink('/out.pdf'); } catch(e) {}
    if (!out) throw new Error('No se pudo desbloquear. Si el PDF pide contraseña para abrirlo, no se puede abrir sin ella ):');
    return out;
  }
  async function openPdf(buf){
    try { return await PDFLib.PDFDocument.load(buf); }
    catch(e){
      if (e && /encrypt/i.test((e.name || '') + ' ' + (e.message || ''))) return await PDFLib.PDFDocument.load(await decryptPdf(buf, ''));
      throw e;
    }
  }

  function canvasJpg(c, q){
    return new Promise(function(res){ c.toBlob(function(b){ b.arrayBuffer().then(res) }, 'image/jpeg', q) });
  }
  function mb(n){ return (n/1048576).toFixed(n < 1048576*10 ? 2 : 1) + ' MB' }

  function renderEdit(){
    list.className = 'grid';
    list.innerHTML = '';
    editPages.forEach(function(p, i){
      var li = document.createElement('li');
      var th = document.createElement('div'); th.className = 'th';
      var im = document.createElement('img'); im.src = p.thumb; im.alt = 'Página ' + (p.idx+1);
      im.style.transform = 'rotate(' + p.rot + 'deg)';
      th.appendChild(im);
      var pn = document.createElement('div'); pn.className = 'pn'; pn.textContent = 'Pág. ' + (p.idx+1) + ' (va en ' + (i+1) + ')';
      var r1 = document.createElement('div'); r1.className = 'row';
      var r2 = document.createElement('div'); r2.className = 'row';
      function mk(t, fn, dis){ var b = document.createElement('button'); b.textContent = t; b.disabled = !!dis; b.onclick = fn; return b; }
      r1.appendChild(mk('◀', function(){ var t = editPages[i]; editPages[i] = editPages[i-1]; editPages[i-1] = t; renderEdit() }, i===0));
      r1.appendChild(mk('▶', function(){ var t = editPages[i]; editPages[i] = editPages[i+1]; editPages[i+1] = t; renderEdit() }, i===editPages.length-1));
      r2.appendChild(mk('↺', function(){ p.rot = (p.rot + 270) % 360; renderEdit() }));
      r2.appendChild(mk('↻', function(){ p.rot = (p.rot + 90) % 360; renderEdit() }));
      r2.appendChild(mk('✕', function(){ editPages.splice(i,1); renderEdit() }));
      [th, pn, r1, r2].forEach(function(e){ li.appendChild(e) });
      list.appendChild(li);
    });
    go.disabled = editPages.length === 0;
    go.textContent = 'Crear PDF con estas páginas';
  }

  async function loadEdit(file){
    var id = ++loadId;
    editPages = []; files = [file]; renderEdit();
    try{
      say('Abriendo ' + file.name + '…');
      editBuf = await file.arrayBuffer();
      var pdfjs = await loadPdfjs();
      var doc = await pdfjs.getDocument({data: new Uint8Array(editBuf.slice(0))}).promise;
      for (var n=1; n<=doc.numPages; n++){
        if (id !== loadId) { doc.destroy(); return; }
        say('Cargando páginas… ' + n + ' de ' + doc.numPages);
        var pg = await doc.getPage(n);
        var v1 = pg.getViewport({scale:1});
        var v = pg.getViewport({scale: 220 / Math.max(v1.width, v1.height)});
        var c = document.createElement('canvas'); c.width = Math.floor(v.width); c.height = Math.floor(v.height);
        var cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0,0,c.width,c.height);
        await pg.render({canvasContext: cx, viewport: v}).promise;
        var thumb = c.toDataURL('image/jpeg', 0.7);
        c.width = 0; c.height = 0; pg.cleanup();
        if (id !== loadId) { doc.destroy(); return; }
        editPages.push({idx: n-1, rot: 0, thumb: thumb});
        if (n === 1 || n % 5 === 0 || n === doc.numPages) renderEdit();
      }
      doc.destroy();
      if (id === loadId){ say(''); renderEdit(); }
    }catch(e){
      if (id === loadId){ say('No pude abrir ese PDF: ' + ((e && e.message) || 'revisa que sea válido'), true); }
    }
  }

  async function buildEdit(){
    var PDFDocument = PDFLib.PDFDocument;
    var src = await openPdf(editBuf);
    var out = await PDFDocument.create();
    var pages = await out.copyPages(src, editPages.map(function(p){ return p.idx }));
    pages.forEach(function(pg, i){
      var ang = pg.getRotation().angle;
      pg.setRotation(PDFLib.degrees(((ang + editPages[i].rot) % 360 + 360) % 360));
      out.addPage(pg);
    });
    return await out.save();
  }

  function stampReset(){
    renderTok++; stampBuf = null; stampImg = null; stampPage = 0; placements = {};
    if (stampDoc){ try{ stampDoc.destroy() }catch(e){} stampDoc = null; }
    $('ov').style.display = 'none';
    $('slabel').textContent = 'Elige un PDF y una imagen';
    var cv = $('scv'); cv.width = 0; cv.height = 0; $('stage').style.width = '0px';
  }
  function canvasPng(c){ return new Promise(function(res){ c.toBlob(function(b){ b.arrayBuffer().then(res) }, 'image/png') }) }
  async function normImg(file){
    var bm = await createImageBitmap(file);
    var sc = Math.min(1, 2000 / Math.max(bm.width, bm.height));
    var c = document.createElement('canvas'); c.width = Math.round(bm.width*sc); c.height = Math.round(bm.height*sc);
    var cx = c.getContext('2d'); var png = /png|webp|gif/.test(file.type || '');
    if (!png){ cx.fillStyle = '#fff'; cx.fillRect(0,0,c.width,c.height); }
    cx.drawImage(bm, 0, 0, c.width, c.height);
    var buf = png ? await canvasPng(c) : await canvasJpg(c, 0.92);
    return {bytes: buf, png: png, w: c.width, h: c.height, url: URL.createObjectURL(new Blob([buf], {type: png ? 'image/png' : 'image/jpeg'}))};
  }
  async function loadStampImg(file){
    try{
      say('Preparando imagen…');
      stampImg = await normImg(file);
      $('ovimg').src = stampImg.url; say('');
      showStamp(); render();
    }catch(e){ say('No se pudo abrir esa imagen: ' + ((e && e.message) || 'formato no compatible'), true); }
  }
  async function loadStampPdf(file){
    var id = ++renderTok;
    try{
      say('Abriendo ' + file.name + '…');
      var buf = await file.arrayBuffer();
      var pdfjs = await loadPdfjs();
      var doc = await pdfjs.getDocument({data: new Uint8Array(buf.slice(0))}).promise;
      if (id !== renderTok){ doc.destroy(); return; }
      if (stampDoc){ try{ stampDoc.destroy() }catch(e){} }
      stampBuf = buf; stampDoc = doc; stampPage = 0; placements = {}; files = [file];
      say(''); showStamp(); render();
    }catch(e){ say('No se pudo abrir ese PDF: ' + ((e && e.message) || 'revisa que sea válido'), true); }
  }
  function ratio(){ return stampImg ? stampImg.h / stampImg.w : 1 }
  function clampPlace(p){
    var fh = p.fw * dispW * ratio() / dispH;
    p.fx = Math.min(Math.max(p.fx, 0), Math.max(0, 1 - p.fw));
    p.fy = Math.min(Math.max(p.fy, 0), Math.max(0, 1 - fh));
  }
  function posOverlay(){
    var ov = $('ov'), p = placements[stampPage];
    if (!p || !stampImg){ ov.style.display = 'none'; return; }
    var w = p.fw * dispW;
    ov.style.display = 'block';
    ov.style.left = (p.fx * dispW) + 'px'; ov.style.top = (p.fy * dispH) + 'px';
    ov.style.width = w + 'px'; ov.style.height = (w * ratio()) + 'px';
  }
  function updateStampUi(){
    var n = stampDoc ? stampDoc.numPages : 0, p = placements[stampPage];
    $('slabel').textContent = n ? 'Página ' + (stampPage+1) + ' de ' + n : 'Elige un PDF y una imagen';
    $('sprev').disabled = !n || stampPage === 0; $('snext').disabled = !n || stampPage >= n-1;
    $('shere').textContent = p ? 'Quitar de esta página' : 'Poner aquí';
    $('shere').disabled = !n || !stampImg; $('scopy').disabled = !p;
    $('ssize').value = Math.round((p ? p.fw : stampSize) * 100); $('ssize').disabled = !p;
  }
  async function showStamp(){
    if (!stampDoc){ updateStampUi(); return; }
    var id = ++renderTok, page = stampPage;
    var pg = await stampDoc.getPage(page + 1);
    var avail = Math.max(200, $('stampui').clientWidth - 2);
    var v1 = pg.getViewport({scale:1}), s = avail / v1.width, dpr = Math.min(window.devicePixelRatio || 1, 2);
    var vD = pg.getViewport({scale: s}), vR = pg.getViewport({scale: s * dpr});
    var cv = $('scv'); cv.width = Math.floor(vR.width); cv.height = Math.floor(vR.height);
    cv.style.width = vD.width + 'px'; cv.style.height = vD.height + 'px';
    $('stage').style.width = vD.width + 'px'; $('stage').style.height = vD.height + 'px';
    dispW = vD.width; dispH = vD.height;
    updateStampUi(); posOverlay();
    var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0,0,cv.width,cv.height);
    await pg.render({canvasContext: cx, viewport: vR}).promise;
    if (id !== renderTok) return;
  }
  function renderStamp(){
    list.innerHTML = '';
    go.disabled = !(stampDoc && stampImg && Object.keys(placements).length);
    go.textContent = 'Crear PDF con la imagen';
    updateStampUi();
  }
  function placeAt(cx, cy){
    var p = placements[stampPage] || (placements[stampPage] = {fx:0, fy:0, fw: stampSize});
    var fh = p.fw * dispW * ratio() / dispH;
    p.fx = cx - p.fw/2; p.fy = cy - fh/2; clampPlace(p);
    posOverlay(); renderStamp();
  }
  $('sprev').onclick = function(){ if (stampPage > 0){ stampPage--; showStamp(); } };
  $('snext').onclick = function(){ if (stampDoc && stampPage < stampDoc.numPages-1){ stampPage++; showStamp(); } };
  $('shere').onclick = function(){
    if (placements[stampPage]){ delete placements[stampPage]; posOverlay(); renderStamp(); }
    else placeAt(0.5, 0.5);
  };
  $('scopy').onclick = function(){
    var p = placements[stampPage]; if (!p || !stampDoc) return;
    for (var i=0;i<stampDoc.numPages;i++) placements[i] = {fx:p.fx, fy:p.fy, fw:p.fw};
    say('Listo: la imagen se pondrá en las ' + stampDoc.numPages + ' páginas.'); renderStamp();
  };
  $('ssize').oninput = function(){
    var p = placements[stampPage]; if (!p) return;
    var fh0 = p.fw * dispW * ratio() / dispH, cx = p.fx + p.fw/2, cy = p.fy + fh0/2;
    p.fw = $('ssize').value / 100; stampSize = p.fw;
    var fh1 = p.fw * dispW * ratio() / dispH;
    p.fx = cx - p.fw/2; p.fy = cy - fh1/2; clampPlace(p); posOverlay();
  };
  $('stage').onclick = function(e){
    if (!stampImg || !stampDoc || e.target === $('ov')) return;
    var r = $('stage').getBoundingClientRect();
    placeAt((e.clientX - r.left) / dispW, (e.clientY - r.top) / dispH);
  };
  (function(){
    var ov = $('ov'), drag = null;
    ov.onpointerdown = function(e){
      var p = placements[stampPage]; if (!p) return;
      drag = {sx: e.clientX, sy: e.clientY, fx: p.fx, fy: p.fy};
      ov.setPointerCapture(e.pointerId); e.preventDefault();
    };
    ov.onpointermove = function(e){
      if (!drag) return; var p = placements[stampPage];
      p.fx = drag.fx + (e.clientX - drag.sx) / dispW; p.fy = drag.fy + (e.clientY - drag.sy) / dispH;
      clampPlace(p); posOverlay();
    };
    ov.onpointerup = ov.onpointercancel = function(){ drag = null };
  })();

  async function buildStamp(){
    var src = await openPdf(stampBuf);
    var img = stampImg.png ? await src.embedPng(stampImg.bytes) : await src.embedJpg(stampImg.bytes);
    var pages = src.getPages(), r = ratio();
    for (var key in placements){
      var n = +key, p = placements[key];
      var pg = await stampDoc.getPage(n + 1), v = pg.getViewport({scale:1});
      var wpx = p.fw * v.width, hpx = wpx * r;
      var left = Math.min(Math.max(p.fx * v.width, 0), Math.max(0, v.width - wpx));
      var top = Math.min(Math.max(p.fy * v.height, 0), Math.max(0, v.height - hpx));
      var bl = v.convertToPdfPoint(left, top + hpx), br = v.convertToPdfPoint(left + wpx, top + hpx);
      var ang = Math.atan2(br[1] - bl[1], br[0] - bl[0]) * 180 / Math.PI, w = Math.hypot(br[0] - bl[0], br[1] - bl[1]);
      pages[n].drawImage(img, {x: bl[0], y: bl[1], width: w, height: w * r, rotate: PDFLib.degrees(ang)});
    }
    return await src.save();
  }

  async function build(level){
    if (mode === 'edit') return buildEdit();
    if (mode === 'stamp') return buildStamp();
    if (mode === 'unlock') return decryptPdf(await files[0].arrayBuffer(), '');
    var PDFDocument = PDFLib.PDFDocument;
    var out = await PDFDocument.create();
    var cfg = QUAL[level];
    if (mode === 'merge'){
      if (!cfg){
        for (var i=0;i<files.length;i++){
          var src = await openPdf(await files[i].arrayBuffer());
          var pages = await out.copyPages(src, parsePages(files[i].pages, src.getPageCount(), files[i].name));
          pages.forEach(function(p){ out.addPage(p) });
        }
      } else {
        var pdfjs = await loadPdfjs();
        for (var i2=0;i2<files.length;i2++){
          var doc = await pdfjs.getDocument({data: new Uint8Array(await files[i2].arrayBuffer())}).promise;
          var idx = parsePages(files[i2].pages, doc.numPages, files[i2].name);
          for (var k=0;k<idx.length;k++){
            say('Comprimiendo ' + files[i2].name + ' (página ' + (k+1) + ' de ' + idx.length + ')…');
            var pg = await doc.getPage(idx[k]+1);
            var v1 = pg.getViewport({scale:1}), v = pg.getViewport({scale: cfg.dpi/72});
            var c = document.createElement('canvas'); c.width = Math.floor(v.width); c.height = Math.floor(v.height);
            var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
            await pg.render({canvasContext: ctx, viewport: v}).promise;
            var im = await out.embedJpg(await canvasJpg(c, cfg.jpg));
            out.addPage([v1.width, v1.height]).drawImage(im, {x:0, y:0, width:v1.width, height:v1.height});
            c.width = 0; c.height = 0; pg.cleanup();
          }
          doc.destroy();
        }
      }
    } else {
      for (var j=0;j<files.length;j++){
        var f = files[j], img, t = (f.type||'').toLowerCase();
        say('Procesando imagen ' + (j+1) + ' de ' + files.length + '…');
        if (cfg){
          var bm = await createImageBitmap(f);
          var sc = Math.min(1, cfg.maxPx / Math.max(bm.width, bm.height));
          var cv = document.createElement('canvas'); cv.width = Math.round(bm.width*sc); cv.height = Math.round(bm.height*sc);
          var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0,0,cv.width,cv.height);
          cx.drawImage(bm, 0, 0, cv.width, cv.height);
          img = await out.embedJpg(await canvasJpg(cv, cfg.jpg));
        } else {
          var buf = await f.arrayBuffer();
          if (t === 'image/png') img = await out.embedPng(buf);
          else if (t === 'image/jpeg') img = await out.embedJpg(buf);
          else { var r = await toPng(f); img = await out.embedPng(r.bytes); }
        }
        out.addPage([img.width, img.height]).drawImage(img, {x:0, y:0, width:img.width, height:img.height});
      }
    }
    return await out.save();
  }

  function updateNote(){
    var q = $('qual').value, n = $('qnote');
    if (q === 'orig') n.textContent = 'Se conserva todo tal cual, con el texto seleccionable.';
    else if (mode === 'merge') n.textContent = 'Las páginas se convierten en imagen: pesa mucho menos, pero el texto ya no se podrá seleccionar. Ideal para escaneos.';
    else n.textContent = 'Las fotos se reducen de tamaño y se guardan como JPG.';
  }
  $('qual').onchange = updateNote;

  go.onclick = async function(){
    go.disabled = true; say('Creando tu PDF…');
    try{
      var level = (mode === 'edit' || mode === 'unlock' || mode === 'stamp') ? 'orig' : $('qual').value;
      var before = files.reduce(function(t, f){ return t + f.size }, 0);
      var bytes = await build(level);
      var base = files[0] ? files[0].name.replace(/\.pdf$/i, '') : 'archivo';
      var name = mode==='stamp' ? base + '-con-imagen.pdf' : mode==='unlock' ? base + '-desbloqueado.pdf' : (mode==='merge' ? 'unido' : mode==='edit' ? 'editado' : 'imagenes') + (level==='orig' ? '' : '-comprimido') + '.pdf';
      var url = URL.createObjectURL(new Blob([bytes], {type:'application/pdf'}));
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url) }, 60000);
      var info = ' Pesa ' + mb(bytes.length) + (level==='orig' ? '.' : ' (antes ' + mb(before) + ').');
      say('Ya quedó :D Tu PDF se guardó. ✅' + info + (level!=='orig' && bytes.length >= before ? ' No bajó de peso: mejor usa Original.' : ''));
    }catch(e){
      say('Algo falló: ' + ((e && e.message) || 'revisa que los archivos sean válidos') , true);
    }
    render();
  };

  var root = document.documentElement, tb = document.getElementById('theme');
  function isDark(){ var t = root.getAttribute('data-theme'); return t ? t==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches; }
  function paint(){ tb.textContent = isDark() ? '☀️' : '🌙'; }
  try{ var saved = localStorage.getItem('pdf-theme'); if (saved) root.setAttribute('data-theme', saved); }catch(e){}
  tb.onclick = function(){
    var next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('pdf-theme', next); }catch(e){}
    paint();
  };
  paint();

  setMode('merge');
  updateNote();
})();
</script>
</body>
